services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: url-shortener-backend
    container_name: url-shortener-api
    ports:
      - "8080:8080"
    volumes:
      - urlshortener-data:/data
    environment:
      DATABASE_PATH: /data/urlshortener.db
      SERVER_PORT: 8080
    restart: unless-stopped
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: url-shortener-frontend
    container_name: url-shortener-frontend
    ports:
      - "3000:80"
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - app-network

  sqlite-web:
    image: coleifer/sqlite-web
    container_name: sqlite-web
    command: sqlite_web -H 0.0.0.0 /data/urlshortener.db
    ports:
      - "8081:8080"
    volumes:
      - urlshortener-data:/data
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  urlshortener-data:
    name: urlshortener-data
    external: true